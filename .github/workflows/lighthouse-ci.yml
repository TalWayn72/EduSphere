name: Lighthouse CI — LCP Budget

on:
  pull_request:
    paths:
      - 'apps/web/src/**'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @edusphere/web build

      - name: Start preview server
        run: |
          pnpm --filter @edusphere/web preview &
          sleep 5

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:4173/
            http://localhost:4173/courses
            http://localhost:4173/dashboard
          budgetPath: ./apps/web/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Check LCP budget
        run: |
          echo "Checking LCP differential budget..."
          # LCP must be < 2.5s (Good), warn at 2.0s
          # Per-build delta must be < 200ms
          for result in .lighthouseci/lhr-*.json; do
            LCP=$(jq -r '.audits["largest-contentful-paint"].numericValue' "$result")
            echo "LCP: ${LCP}ms (budget: 2500ms)"
            if [ "$(echo "$LCP > 2500" | bc)" -eq 1 ]; then
              echo "ERROR: LCP exceeds 2.5s budget"
              exit 1
            fi
          done
          echo "LCP within budget ✓"
