name: Release — Generate Changelog

on:
  push:
    tags:
      - "v*" # Trigger on version tags (v1.0.0, v2.1.3, etc.)

permissions:
  contents: write

jobs:
  changelog:
    name: Generate & Commit Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history needed for changelog generation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install conventional-changelog-cli
        run: npm install -g conventional-changelog-cli

      - name: Generate changelog (latest release)
        run: bash scripts/generate-changelog.sh --latest

      - name: Commit and push changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet CHANGELOG.md; then
            echo "No changelog changes to commit"
            exit 0
          fi

          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md for ${GITHUB_REF_NAME}"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Update GitHub Release body
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');

            // Read the generated changelog and extract the latest section
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const sections = changelog.split(/^## /m).filter(Boolean);
            const latestSection = sections[0] || 'No changelog entries found.';

            // Find or create the release
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag,
              });

              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                body: latestSection.trim(),
              });
              console.log(`Updated release ${tag} with changelog`);
            } catch (e) {
              // Release doesn't exist yet — create it
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `Release ${tag}`,
                body: latestSection.trim(),
                draft: false,
                prerelease: tag.includes('-'),
              });
              console.log(`Created release ${tag} with changelog`);
            }
