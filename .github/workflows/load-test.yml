name: Load Test (Nightly Smoke)

on:
  schedule:
    - cron: "0 2 * * *" # 2 AM UTC daily
  workflow_dispatch:

env:
  K6_VERSION: "0.50.0"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: edusphere
          POSTGRES_PASSWORD: edusphere
          POSTGRES_DB: edusphere
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          curl -sL https://github.com/grafana/k6/releases/download/v${{ env.K6_VERSION }}/k6-v${{ env.K6_VERSION }}-linux-amd64.tar.gz | tar xz
          sudo mv k6-v${{ env.K6_VERSION }}-linux-amd64/k6 /usr/local/bin/

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @edusphere/db build
          pnpm --filter @edusphere/config build
          pnpm --filter @edusphere/nats-client build
          pnpm --filter @edusphere/auth build
          pnpm --filter @edusphere/metrics build
        env:
          DATABASE_URL: postgres://edusphere:edusphere@localhost:5432/edusphere

      - name: Run database migrations and seed
        run: |
          pnpm --filter @edusphere/db migrate
          pnpm --filter @edusphere/db seed
        env:
          DATABASE_URL: postgres://edusphere:edusphere@localhost:5432/edusphere

      - name: Start services
        run: |
          pnpm turbo dev --filter='@edusphere/gateway' --filter='@edusphere/subgraph-*' &
          echo "Waiting for gateway to start..."
          for i in $(seq 1 60); do
            if curl -sf --max-time 5 http://localhost:4000/health > /dev/null 2>&1 || \
               curl -sf --max-time 5 http://localhost:4000 > /dev/null 2>&1; then
              echo "Gateway is ready after ${i}s"
              break
            fi
            sleep 2
          done
        env:
          DATABASE_URL: postgres://edusphere:edusphere@localhost:5432/edusphere

      - name: Run k6 smoke test
        run: k6 run infrastructure/load-testing/scenarios/smoke-ci.js
        continue-on-error: true # Load test may fail if services don't fully start
        env:
          GATEWAY_URL: http://localhost:4000/graphql

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: infrastructure/load-testing/results/
          retention-days: 30
