extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.7"
    import: ["@key", "@authenticated", "@requiresScopes"]
  )

"""
KnowledgeSource — an information source attached to a course.
Modelled after NotebookLM: users can attach DOCX, PDF, URLs, YouTube, or raw text.
"""
type KnowledgeSource {
  id: ID!
  courseId: ID!
  tenantId: ID!
  title: String!
  sourceType: SourceType!
  """
  Original file name, URL, or YouTube link
  """
  origin: String
  """
  Full extracted plaintext (may be large — use with care)
  """
  rawContent: String
  """
  Preview of first 500 chars
  """
  preview: String
  status: SourceStatus!
  chunkCount: Int!
  errorMessage: String
  metadata: JSON
  """
  Presigned MinIO URL for viewing the original file (PDF, DOCX, TXT). Null for URL/YouTube/Text sources.
  """
  fileUrl: String
  createdAt: String!
}

enum SourceType {
  FILE_DOCX
  FILE_PDF
  FILE_TXT
  URL
  YOUTUBE
  TEXT
}

enum SourceStatus {
  PENDING
  PROCESSING
  READY
  FAILED
}

input AddUrlSourceInput {
  courseId: ID!
  title: String!
  url: String!
}

input AddTextSourceInput {
  courseId: ID!
  title: String!
  text: String!
}

input AddYoutubeSourceInput {
  courseId: ID!
  title: String!
  """
  Full YouTube video URL (youtube.com/watch?v=... or youtu.be/...)
  """
  url: String!
}

input UpdateKnowledgeSourceInput {
  title: String
  metadata: JSON
}

input AddFileSourceInput {
  courseId: ID!
  title: String!
  """
  Original filename — used to determine SourceType (pdf/docx/txt)
  """
  fileName: String!
  """
  Base64-encoded file content
  """
  contentBase64: String!
  """
  MIME type hint (e.g. application/pdf)
  """
  mimeType: String!
}

extend type Query {
  courseKnowledgeSources(courseId: ID!): [KnowledgeSource!]! @authenticated
  knowledgeSource(id: ID!): KnowledgeSource @authenticated
}

extend type Mutation {
  """
  Add a URL as a knowledge source.
  The system fetches the page, extracts text, chunks it and embeds it.
  """
  addUrlSource(input: AddUrlSourceInput!): KnowledgeSource!
    @authenticated
    @requiresScopes(scopes: [["course:write"]])

  """
  Add raw text as a knowledge source.
  """
  addTextSource(input: AddTextSourceInput!): KnowledgeSource!
    @authenticated
    @requiresScopes(scopes: [["course:write"]])

  """
  Add a YouTube video as a knowledge source.
  The system fetches the auto-generated transcript and indexes it.
  """
  addYoutubeSource(input: AddYoutubeSourceInput!): KnowledgeSource!
    @authenticated
    @requiresScopes(scopes: [["course:write"]])

  """
  Upload a local file (DOCX / PDF / TXT) as a knowledge source.
  The content is passed as a base64-encoded string so it can travel through
  the GraphQL gateway without a multipart transport layer.
  """
  addFileSource(input: AddFileSourceInput!): KnowledgeSource!
    @authenticated
    @requiresScopes(scopes: [["course:write"]])

  """
  Update title and/or metadata of a knowledge source.
  """
  updateKnowledgeSource(id: ID!, input: UpdateKnowledgeSourceInput!): KnowledgeSource!
    @authenticated
    @requiresScopes(scopes: [["course:write"]])

  """
  Remove a knowledge source (and its embeddings).
  """
  deleteKnowledgeSource(id: ID!): Boolean!
    @authenticated
    @requiresScopes(scopes: [["course:write"]])

  """
  Re-generate embeddings for all READY knowledge sources in a course.
  Useful after embedding model changes or corruption recovery.
  """
  reindexCourseEmbeddings(courseId: ID!): ReindexResult!
    @authenticated
    @requiresScopes(scopes: [["course:manage"]])
}

type ReindexResult {
  sourcesProcessed: Int!
  embeddingsGenerated: Int!
  errors: [String!]!
}
