extend type User @key(fields: "id") {
  followersCount: Int!
  followingCount: Int!
  isFollowedByMe: Boolean!
}

type SocialFeedItem {
  id: ID!
  actorId: ID!
  actorDisplayName: String!
  verb: String!
  objectType: String!
  objectId: ID!
  objectTitle: String!
  createdAt: String!
}

type SocialRecommendation {
  contentItemId: ID!
  contentTitle: String!
  followersCount: Int!
  isMutualFollower: Boolean!
  lastActivity: String!
}

extend type Query {
  myFollowers(limit: Int): [ID!]! @authenticated
  myFollowing(limit: Int): [ID!]! @authenticated
  searchUsers(query: String!, limit: Int): [PublicProfile!]! @authenticated
  socialFeed(limit: Int): [SocialFeedItem!]! @authenticated
  socialRecommendations(limit: Int): [SocialRecommendation!]! @authenticated
}

extend type Mutation {
  followUser(userId: ID!): Boolean! @authenticated
  unfollowUser(userId: ID!): Boolean! @authenticated
}
