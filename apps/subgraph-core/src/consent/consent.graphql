extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.7"
    import: ["@key", "@shareable", "@authenticated", "@requiresScopes"]
  )

extend type Mutation {
  updateConsent(input: UpdateConsentInput!): Boolean! @authenticated
}

input UpdateConsentInput {
  consentType: ConsentType!
  given: Boolean!
}

enum ConsentType {
  AI_PROCESSING
  THIRD_PARTY_LLM
  ANALYTICS
  MARKETING
  RESEARCH
}
