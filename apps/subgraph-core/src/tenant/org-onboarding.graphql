extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.7", import: ["@key", "@shareable", "@authenticated"])

# ─── Provisioning ──────────────────────────────────────────────

enum ProvisioningStatus {
  PROVISIONING
  ACTIVE
  FAILED
  SUSPENDED
}

type Organization @key(fields: "id") {
  id: ID!
  name: String!
  slug: String!
  plan: TenantPlan!
  provisioningStatus: ProvisioningStatus!
  trialEndsAt: DateTime
  onboardingChecklist: OrgOnboardingChecklist
  memberCount: Int!
  createdAt: DateTime!
}

type OrgOnboardingChecklist {
  brandingConfigured: Boolean!
  firstUserInvited: Boolean!
  firstCourseCreated: Boolean!
  domainConfigured: Boolean!
  ssoConfigured: Boolean!
  completionPercentage: Int!
}

# ─── Invitations ──────────────────────────────────────────────

enum InvitationStatus {
  PENDING
  ACCEPTED
  EXPIRED
  REVOKED
}

type OrgInvitation {
  id: ID!
  email: String!
  role: String!
  status: InvitationStatus!
  expiresAt: DateTime!
  createdAt: DateTime!
}

type OrgMember {
  id: ID!
  email: String!
  name: String
  role: String!
  joinedAt: DateTime!
  lastActiveAt: DateTime
}

# ─── Trial ────────────────────────────────────────────────────

type TrialStatus {
  isTrialing: Boolean!
  trialEndsAt: DateTime
  daysRemaining: Int!
  isInGracePeriod: Boolean!
  gracePeriodEndsAt: DateTime
}

# ─── Licensing ────────────────────────────────────────────────

enum LicenseType {
  UNLIMITED
  PER_SEAT
  TIME_LIMITED
}

enum LicenseStatus {
  ACTIVE
  EXPIRED
  REVOKED
}

type CourseLicense {
  id: ID!
  courseId: ID!
  licenseType: LicenseType!
  maxSeats: Int
  usedSeats: Int!
  status: LicenseStatus!
  licensedAt: DateTime!
  expiresAt: DateTime
}

# ─── Analytics ────────────────────────────────────────────────

input DateRangeInput {
  from: DateTime!
  to: DateTime!
}

type OrgAnalytics {
  activeLearners: Int!
  totalEnrollments: Int!
  completionRate: Float!
  totalLearningHours: Float!
  topCourses: [CourseAnalyticsItem!]!
  dailySnapshots: [AnalyticsSnapshot!]!
}

type CourseAnalyticsItem {
  courseId: ID!
  title: String!
  enrollmentCount: Int!
  completionRate: Float!
  avgTimeToComplete: Float
}

type AnalyticsSnapshot {
  date: String!
  activeLearners: Int!
  completions: Int!
  newEnrollments: Int!
  learningMinutes: Int!
}

enum OrgExportFormat {
  CSV
  PDF
}

input ExportAnalyticsInput {
  format: OrgExportFormat!
  dateRange: DateRangeInput!
}

type ExportResult {
  downloadUrl: String!
  expiresAt: DateTime!
  format: OrgExportFormat!
}

# ─── At-Risk Learners ────────────────────────────────────────

enum RiskLevel {
  HIGH
  MEDIUM
  LOW
}

type AtRiskLearnerItem {
  userId: ID!
  email: String!
  name: String!
  lastActive: DateTime
  quizPassRate: Float!
  completionRate: Float!
  riskLevel: RiskLevel!
}

type LearnerAnalyticsDetail {
  userId: ID!
  email: String!
  name: String!
  coursesEnrolled: Int!
  coursesCompleted: Int!
  avgQuizScore: Float!
  totalLearningHours: Float!
  activityTimeline: [ActivityEntry!]!
}

type ActivityEntry {
  date: DateTime!
  type: String!
  description: String!
}

# ─── Gamification Config ─────────────────────────────────────

enum LeaderboardScope {
  TENANT
  DEPARTMENT
  GLOBAL
}

type GamificationConfig {
  enabled: Boolean!
  showLeaderboard: Boolean!
  showBadges: Boolean!
  showPoints: Boolean!
  showStreaks: Boolean!
  xpRules: JSON!
  leaderboardScope: LeaderboardScope!
}

input UpdateGamificationConfigInput {
  enabled: Boolean
  showLeaderboard: Boolean
  showBadges: Boolean
  showPoints: Boolean
  showStreaks: Boolean
  xpRules: JSON
  leaderboardScope: LeaderboardScope
}

# ─── Org Badges (F-12) ────────────────────────────────────────

type OrgBadge {
  id: ID!
  name: String!
  description: String
  iconUrl: String
  xpRequired: Int!
  autoAwardCriteria: JSON
  isActive: Boolean!
  createdAt: DateTime!
}

input CreateOrgBadgeInput {
  name: String!
  description: String
  iconUrl: String
  xpRequired: Int!
  autoAwardCriteria: JSON
}

input UpdateOrgBadgeInput {
  name: String
  description: String
  iconUrl: String
  xpRequired: Int
  autoAwardCriteria: JSON
  isActive: Boolean
}

# ─── API Keys ─────────────────────────────────────────────────

type ApiKey {
  id: ID!
  name: String!
  keyPrefix: String!
  scopes: [String!]!
  rateLimitPerMinute: Int!
  lastUsedAt: DateTime
  expiresAt: DateTime
  isActive: Boolean!
  createdAt: DateTime!
}

type ApiKeyCreated {
  apiKey: ApiKey!
  plainTextKey: String!
}

input CreateApiKeyInput {
  name: String!
  scopes: [String!]!
  rateLimitPerMinute: Int = 60
  expiresAt: DateTime
}

# ─── Webhooks ─────────────────────────────────────────────────

type Webhook {
  id: ID!
  url: String!
  events: [String!]!
  isActive: Boolean!
  failureCount: Int!
  lastTriggeredAt: DateTime
  createdAt: DateTime!
}

enum WebhookDeliveryStatus {
  PENDING
  DELIVERED
  FAILED
  RETRYING
}

type WebhookDelivery {
  id: ID!
  eventType: String!
  responseStatus: Int
  attempt: Int!
  status: WebhookDeliveryStatus!
  deliveredAt: DateTime
  createdAt: DateTime!
}

input CreateWebhookInput {
  url: String!
  events: [String!]!
}

input UpdateWebhookInput {
  url: String
  events: [String!]
  isActive: Boolean
}

# ─── Custom Domains (F-03) ────────────────────────────────────

type CustomDomain {
  id: ID!
  domain: String!
  verificationToken: String
  verificationRecordType: String
  verifiedAt: DateTime
  sslStatus: String!
  createdAt: DateTime!
}

type DomainVerificationInfo {
  token: String!
  recordType: String!
  recordValue: String!
  instructions: String!
}

# ─── Input Types ──────────────────────────────────────────────

input CreateOrganizationInput {
  name: String!
  slug: String!
  adminEmail: String!
  adminFirstName: String!
  adminLastName: String!
  idempotencyKey: String!
}

input InviteUserInput {
  email: String!
  role: String!
  message: String
}

input LicenseCourseInput {
  courseId: ID!
  licenseType: LicenseType!
  maxSeats: Int
  durationMonths: Int
}

# ─── Queries ──────────────────────────────────────────────────

extend type Query {
  myOrganization: Organization! @authenticated
  orgMembers(limit: Int = 20, offset: Int = 0): [OrgMember!]!
    @authenticated
  orgInvitations(status: InvitationStatus): [OrgInvitation!]!
    @authenticated
  trialStatus: TrialStatus! @authenticated
  apiKeys: [ApiKey!]! @authenticated
  webhooks: [Webhook!]! @authenticated
  webhookDeliveries(webhookId: ID!, limit: Int = 20): [WebhookDelivery!]!
    @authenticated
  customDomains: [CustomDomain!]! @authenticated
  courseLicenses: [CourseLicense!]! @authenticated
  gamificationConfig: GamificationConfig! @authenticated
  orgBadges: [OrgBadge!]! @authenticated
  orgAnalytics(dateRange: DateRangeInput!): OrgAnalytics! @authenticated
  orgAtRiskLearners(limit: Int = 20, offset: Int = 0): [AtRiskLearnerItem!]!
    @authenticated
  learnerDetail(userId: ID!): LearnerAnalyticsDetail @authenticated
}

# ─── Mutations ────────────────────────────────────────────────

extend type Mutation {
  createOrganization(input: CreateOrganizationInput!): Organization!

  inviteUser(input: InviteUserInput!): OrgInvitation!
    @authenticated
  acceptInvitation(token: String!): OrgMember!
  revokeInvitation(id: ID!): Boolean!
    @authenticated
  updateMemberRole(userId: ID!, role: String!): OrgMember!
    @authenticated
  removeMember(userId: ID!): Boolean!
    @authenticated

  createApiKey(input: CreateApiKeyInput!): ApiKeyCreated!
    @authenticated
  revokeApiKey(id: ID!): Boolean!
    @authenticated

  createWebhook(input: CreateWebhookInput!): Webhook!
    @authenticated
  updateWebhook(id: ID!, input: UpdateWebhookInput!): Webhook!
    @authenticated
  deleteWebhook(id: ID!): Boolean!
    @authenticated
  testWebhook(id: ID!): WebhookDelivery!
    @authenticated

  requestDomainVerification(domain: String!): DomainVerificationInfo!
    @authenticated
  checkDomainVerification(domain: String!): CustomDomain!
    @authenticated
  removeCustomDomain(domainId: ID!): Boolean!
    @authenticated

  licenseCourse(input: LicenseCourseInput!): CourseLicense!
    @authenticated
  revokeCourseLicense(id: ID!): Boolean!
    @authenticated

  updateGamificationConfig(input: UpdateGamificationConfigInput!): GamificationConfig!
    @authenticated

  createOrgBadge(input: CreateOrgBadgeInput!): OrgBadge! @authenticated
  updateOrgBadge(id: ID!, input: UpdateOrgBadgeInput!): OrgBadge! @authenticated
  deleteOrgBadge(id: ID!): Boolean! @authenticated

  exportAnalytics(input: ExportAnalyticsInput!): ExportResult!
    @authenticated
}
