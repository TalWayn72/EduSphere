extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.7", import: ["@key", "@shareable", "@authenticated"])

type Tenant @key(fields: "id") {
  id: ID!
  name: String!
  slug: String!
  plan: TenantPlan!
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum TenantPlan {
  FREE
  STARTER
  PROFESSIONAL
  ENTERPRISE
}

type TenantLanguageSettings {
  supportedLanguages: [String!]!
  defaultLanguage: String!
}

input UpdateTenantLanguageSettingsInput {
  supportedLanguages: [String!]!
  defaultLanguage: String!
}

type TenantBranding {
  logoUrl: String!
  logoMarkUrl: String
  faviconUrl: String!
  primaryColor: String!
  secondaryColor: String!
  accentColor: String!
  backgroundColor: String!
  fontFamily: String!
  organizationName: String!
  tagline: String
  privacyPolicyUrl: String
  termsOfServiceUrl: String
  supportEmail: String
  hideEduSphereBranding: Boolean!
  welcomeMessage: String
  customCss: String
}

input UpdateTenantBrandingInput {
  logoUrl: String
  logoMarkUrl: String
  faviconUrl: String
  primaryColor: String
  secondaryColor: String
  accentColor: String
  backgroundColor: String
  fontFamily: String
  organizationName: String
  tagline: String
  privacyPolicyUrl: String
  termsOfServiceUrl: String
  supportEmail: String
  hideEduSphereBranding: Boolean
  welcomeMessage: String
  customCss: String
}

type PublicTenantBranding {
  primaryColor: String!
  accentColor: String!
  logoUrl: String!
  faviconUrl: String!
  organizationName: String!
  tagline: String
}

type SsoProvider {
  id: ID!
  name: String!
  type: String!
  iconUrl: String
}

type BrandedLoginData {
  orgName: String!
  logoUrl: String
  primaryColor: String
  secondaryColor: String
  welcomeMessage: String
  ssoProviders: [SsoProvider!]!
}

type OrganizationDomain {
  id: ID!
  domain: String!
  verified: Boolean!
  createdAt: DateTime!
}

input UpdateTenantPlanInput {
  tenantId: ID!
  plan: TenantPlan!
  effectiveDate: DateTime
}

type Query {
  tenant(id: ID!): Tenant
  tenants(limit: Int = 10, offset: Int = 0): [Tenant!]!
  myTenantLanguageSettings: TenantLanguageSettings! @authenticated
  myTenantBranding: TenantBranding! @authenticated
  publicBranding(slug: String!): PublicTenantBranding
  brandedLoginData(slug: String!): BrandedLoginData
  organizationDomains(orgId: ID!): [OrganizationDomain!]!
    @authenticated
    @requiresRole(roles: [ORG_ADMIN, SUPER_ADMIN])
}

type Mutation {
  updateTenantLanguageSettings(input: UpdateTenantLanguageSettingsInput!): TenantLanguageSettings!
    @authenticated
    @requiresRole(roles: [ORG_ADMIN, SUPER_ADMIN])
  updateTenantBranding(input: UpdateTenantBrandingInput!): TenantBranding!
    @authenticated
    @requiresRole(roles: [ORG_ADMIN, SUPER_ADMIN])
  updateTenantPlan(input: UpdateTenantPlanInput!): Tenant!
    @authenticated
    @requiresRole(roles: [SUPER_ADMIN])
}
