scalar JSON

type Notification {
  id: ID!
  userId: ID!
  type: NotificationType!
  title: String!
  body: String!
  payload: JSON
  readAt: DateTime
  createdAt: DateTime!
}

enum NotificationType {
  BADGE_ISSUED
  COURSE_ENROLLED
  USER_FOLLOWED
  SRS_REVIEW_DUE
  ANNOUNCEMENT
  LESSON_AVAILABLE
  SESSION_STARTING
  STREAK_REMINDER
  AT_RISK_ALERT
  # Phase 45 — Social Learning
  PEER_REVIEW_ASSIGNED
  PEER_REVIEW_RECEIVED
  DISCUSSION_REPLY
  PEER_FOLLOWED_ACTIVITY
}

extend type Subscription {
  notificationReceived(userId: ID!): Notification! @authenticated
}

# ─── Phase 35: Push Token Registration ───────────────────────────────────────

enum PushPlatform {
  WEB
  IOS
  ANDROID
}

type PushRegistration {
  id: ID!
  platform: PushPlatform!
  createdAt: String!
}

extend type Mutation {
  registerPushToken(
    platform: PushPlatform!
    expoPushToken: String
    webPushSubscription: String
  ): PushRegistration! @authenticated

  """
  F-11: Register a W3C Push API subscription for Web Push delivery.
  Accepts the full PushSubscription JSON (endpoint + keys).
  """
  registerPushSubscription(subscriptionJson: String!): PushRegistration!
    @authenticated

  unregisterPushToken(platform: PushPlatform!): Boolean! @authenticated
}

# ─── Phase 65: Multi-Channel Notification Dispatch ─────────────────────────

enum NotificationChannel {
  PUSH_WEB
  PUSH_MOBILE
  EMAIL
  WHATSAPP
  IN_APP
}

enum DeliveryStatus {
  PENDING
  SENT
  DELIVERED
  FAILED
  BOUNCED
}

type NotificationPreference {
  id: ID!
  notificationType: NotificationType!
  channel: NotificationChannel!
  enabled: Boolean!
}

type NotificationDelivery {
  id: ID!
  notificationType: String!
  channel: NotificationChannel!
  title: String!
  body: String!
  status: DeliveryStatus!
  sentAt: DateTime
  deliveredAt: DateTime
  readAt: DateTime
  createdAt: DateTime!
}

type NotificationDeliveryEdge {
  cursor: String!
  node: NotificationDelivery!
}

type NotificationDeliveryConnection {
  edges: [NotificationDeliveryEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ChannelAnalytics {
  channel: NotificationChannel!
  sent: Int!
  delivered: Int!
  failed: Int!
}

type TypeAnalytics {
  notificationType: String!
  sent: Int!
  delivered: Int!
  failed: Int!
}

type NotificationAnalytics {
  totalSent: Int!
  totalDelivered: Int!
  totalFailed: Int!
  byChannel: [ChannelAnalytics!]!
  byType: [TypeAnalytics!]!
}

input UpdateNotificationPreferenceInput {
  notificationType: NotificationType!
  channel: NotificationChannel!
  enabled: Boolean!
}

type WhatsAppRegistration {
  success: Boolean!
  message: String!
}

type WhatsAppVerification {
  verified: Boolean!
  message: String!
}

extend type Query {
  myNotificationPreferences: [NotificationPreference!]! @authenticated
  myNotificationHistory(
    first: Int
    after: String
    types: [NotificationType!]
    channels: [NotificationChannel!]
  ): NotificationDeliveryConnection! @authenticated
  notificationDeliveryAnalytics(
    startDate: DateTime!
    endDate: DateTime!
  ): NotificationAnalytics!
    @authenticated
    @requiresRole(roles: [ORG_ADMIN, SUPER_ADMIN])
}

extend type Mutation {
  updateNotificationPreference(
    input: UpdateNotificationPreferenceInput!
  ): NotificationPreference! @authenticated
  registerWhatsApp(
    phoneNumber: String!
    countryCode: String!
  ): WhatsAppRegistration! @authenticated
  verifyWhatsApp(code: String!): WhatsAppVerification! @authenticated
  markNotificationDeliveryRead(id: ID!): NotificationDelivery! @authenticated
  markAllNotificationDeliveriesRead: Int! @authenticated
}
