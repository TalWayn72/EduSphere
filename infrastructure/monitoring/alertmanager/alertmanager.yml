global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "alerts@edusphere.com"
  smtp_auth_username: "alerts@edusphere.com"
  smtp_auth_password: "${SMTP_PASSWORD}"
  slack_api_url: "${SLACK_WEBHOOK_URL}"

# Templates for notifications
templates:
  - "/etc/alertmanager/templates/*.tmpl"

# Route tree — SEC-27: Default receiver is team-slack (not null).
# In dev without SLACK_WEBHOOK_URL, Slack posts will fail gracefully.
route:
  group_by: ["alertname", "severity", "service"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: "team-slack"

  # Child routes
  routes:
    # Critical alerts go to PagerDuty AND Slack
    - match:
        severity: critical
      receiver: "pagerduty"
      continue: true

    # All alerts go to Slack
    - match_re:
        severity: critical|warning|info
      receiver: "team-slack"

receivers:
  # Slack — primary alert channel (requires SLACK_WEBHOOK_URL env var)
  - name: "team-slack"
    slack_configs:
      - channel: "#edusphere-alerts"
        send_resolved: true
        title: '{{ template "slack.default.title" . }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }} ({{ .Labels.severity }})
          *Service:* {{ .Labels.service }}
          *Description:* {{ .Annotations.description }}
          *Started:* {{ .StartsAt | since }}
          {{ end }}

  # PagerDuty — critical-only escalation (requires PAGERDUTY_SERVICE_KEY)
  - name: "pagerduty"
    pagerduty_configs:
      - service_key: "${PAGERDUTY_SERVICE_KEY}"
        description: "{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}"
        severity: "{{ .GroupLabels.severity }}"

  # Email — backup channel (requires SMTP_PASSWORD)
  - name: "team-email"
    email_configs:
      - to: "ops@edusphere.com"
        send_resolved: true

# Inhibition rules
inhibit_rules:
  # Don't alert on high response time if service is down
  - source_match:
      alertname: ServiceDown
    target_match:
      alertname: HighResponseTime
    equal: ["service"]
