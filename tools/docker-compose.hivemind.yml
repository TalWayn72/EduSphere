# ─────────────────────────────────────────────────────────────────────────────
# HiveMind — Development infrastructure for agent coordination
# NOT part of the EduSphere product. This is agent tooling only.
#
# Usage: docker-compose -f tools/docker-compose.hivemind.yml up -d
# ─────────────────────────────────────────────────────────────────────────────
version: "3.9"

services:
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: hivemind-chromadb
    ports:
      - "8100:8000"
    volumes:
      - hivemind_chromadb_data:/chroma/chroma
    mem_limit: 512m
    mem_reservation: 256m
    environment:
      - ANONYMIZED_TELEMETRY=false
      - ALLOW_RESET=true
      - IS_PERSISTENT=TRUE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  hivemind_chromadb_data:
